name: app

# test: every PR and push touching app/.
# image: builds the linux/arm64 image natively on an arm64 runner (no QEMU).
# PRs build only, to catch Dockerfile breakage; main pushes :sha-<7>, a vX.Y.Z
# tag pushes :vX.Y.Z, to ghcr.io/sturgeontechnologies/rcracehq-lapcounter.
# Docs: docs/build.md
on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch: # build + push the current main (or a v* tag) by hand

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-24.04-arm # same arch as the Pi; native build, no emulation
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN pushes to this repo's GHCR package
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR names must be lowercase.
      - name: Image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # GHCR tags can be overwritten, so CI never re-pushes a tag that exists
      # (re-runs, or the sha tag when a release tag is cut on a commit main
      # already pushed). A tag always means the same image on the Pis.
      - name: Pick tags
        id: tags
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            candidates=("${GITHUB_REF_NAME}")
          else
            candidates=("sha-${GITHUB_SHA::7}")
          fi
          tags=()
          for t in "${candidates[@]}"; do
            if docker buildx imagetools inspect "$IMAGE:$t" >/dev/null 2>&1; then
              echo "::notice::$t already in GHCR, not pushing it again"
            else
              tags+=("$IMAGE:$t")
            fi
          done
          {
            echo "list<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "push=$([[ ${#tags[@]} -gt 0 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/arm64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.list || 'lapcounter:ci' }}
          provenance: false # plain image manifest; one entry per tag in GHCR
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.tags.outputs.push == 'true'
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Deploy: set \`lapcounter_app_image_tag\` to the part after \`:\` in RCRaceHQ-LapCounter-Deploy."
          } >> "$GITHUB_STEP_SUMMARY"
