name: app

# test: every PR and push touching app/.
# image: builds the linux/arm64 image on PRs (no push) to catch Dockerfile
# breakage; on main pushes :sha-<7>, on a vX.Y.Z tag pushes :vX.Y.Z, to ECR.
# Docs: docs/build.md
on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch: # build + push the current main (or a v* tag) by hand

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: rcracehq/lapcounter

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS; no stored keys
    env:
      # Push only from main / tags, and only once the role exists (repo variable).
      PUSH: ${{ github.event_name != 'pull_request' && vars.AWS_ECR_PUSH_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.PUSH == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are immutable: skip any tag that's already there (re-runs, or the
      # sha tag when a release tag is cut on a commit main already pushed).
      - name: Pick tags
        id: tags
        if: env.PUSH == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            candidates=("${GITHUB_REF_NAME}")
          else
            candidates=("sha-${GITHUB_SHA::7}")
          fi
          tags=()
          for t in "${candidates[@]}"; do
            if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
                 --image-ids imageTag="$t" >/dev/null 2>&1; then
              echo "::notice::$t already in ECR, not pushing it again"
            else
              tags+=("$REGISTRY/$ECR_REPOSITORY:$t")
            fi
          done
          {
            echo "list<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "push=$([[ ${#tags[@]} -gt 0 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/arm64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.list || 'lapcounter:ci' }}
          provenance: false # plain image manifest; ECR lists it as one image
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.tags.outputs.push == 'true'
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Deploy: set \`lapcounter_app_image_tag\` to the part after \`:\` in RCRaceHQ-LapCounter-Deploy."
          } >> "$GITHUB_STEP_SUMMARY"
