---
# defaults/main.yml — openstint_decoder role
#
# Turns a Raspberry Pi + RTL-SDR into an OpenStint lap-timing decoder: installs
# the upstream openstint package, writes /etc/openstint.conf, and drops the
# `openstint-learn` helper into /usr/local/bin. See README.md.
#
# Every var is prefixed openstint_decoder_ so it can't collide with another role.

# ── Upstream apt repo ───────────────────────────────────────────────────
# This is the repo docs/setup-tutorial-raspberry.md points at. It is UNSIGNED
# (upstream ships it as [trusted=yes]), so the role pins it: only the
# `openstint` package may come from it; everything else stays Debian's.
openstint_decoder_apt_repo_url: "https://repo.lapbeeps.com/apt/"
openstint_decoder_apt_origin: "repo.lapbeeps.com"

# ── Decoder settings (rendered into /etc/openstint.conf) ────────────────
# RTL-SDR gain. In direct-sampling mode (RTL-SDR v3 at 5 MHz) the tuner gain
# is ignored by the hardware, so this mostly matters for a V4 dongle.
openstint_decoder_gain: 20
# Learned RC4 files. The package ships this folder root:users 2775 and the
# unit's ReadWritePaths= points here, so don't move it without editing the unit.
openstint_decoder_registry_dir: "/var/lib/openstint"
openstint_decoder_zmq_port: 5556
# Anything else to pass, e.g. "-d 00000001" to pick a dongle by serial or "-b"
# for bias-tee power to a powered loop front end.
openstint_decoder_extra_args: ""

# ── Who can rename/delete .rc4 files without sudo ───────────────────────
# Added to the `users` group (the registry folder's group).
openstint_decoder_registry_users:
  - "{{ ansible_user | default('pi') }}"

# ── Firewall (opt-in) ───────────────────────────────────────────────────
# The decoder publishes on tcp://*:5556 with no auth. When true, ufw allows
# that port from this CIDR only (timing laptop / LAN) and keeps SSH open.
openstint_decoder_manage_ufw: false
openstint_decoder_zmq_allowed_cidr: "192.168.0.0/24"

# ── Package upkeep ──────────────────────────────────────────────────────
# "present" leaves an installed decoder alone; "latest" upgrades it. Don't
# run "latest" on race day.
openstint_decoder_package_state: "present"
