---
# defaults/main.yml — race_hotspot role
#
# Optional event access point on the Pi's built-in Wi-Fi, with a captive
# portal: a new device is sent to http://race (the event web UI) and, once it
# has opened that page, gets internet through the Pi's uplink (NAT).
# DHCP/DNS come from the race_dns role (pulled in via meta/main.yml).

# ── Access point ────────────────────────────────────────────────────────
race_hotspot_interface: "wlan0"
race_hotspot_ssid: "RC Race Event"
# Empty = open network (spectators). 8–63 chars = WPA2-PSK. Keep a real one in
# vault/inventory, not here.
race_hotspot_passphrase: ""
# Regulatory domain; Raspberry Pi OS keeps Wi-Fi rfkill-blocked until set.
race_hotspot_country: "US"
race_hotspot_band: "bg" # 2.4 GHz: best range and every phone supports it
race_hotspot_channel: 6

# ── Addressing (passed to race_dns) ─────────────────────────────────────
# 10.77/24 is unlikely to collide with a track's own LAN. If you change the
# prefix, change the netmask and DHCP pool to match.
race_hotspot_address: "10.77.0.1"
race_hotspot_prefix: 24
race_hotspot_netmask: "255.255.255.0"
race_hotspot_dhcp_start: "10.77.0.50"
race_hotspot_dhcp_end: "10.77.0.250"
race_hotspot_hostname: "race"
race_hotspot_domain: "lan"

# ── Internet sharing ────────────────────────────────────────────────────
# Interfaces hotspot clients are NATed out of once let through. eth0 is the
# required uplink; add wlan1 when the USB Wi-Fi uplink is in use.
race_hotspot_uplinks:
  - eth0
# How long a device stays let through after opening the portal. Matches the
# DHCP lease so an address rarely changes hands while still allowed.
race_hotspot_access_timeout: "12h"

# Ports hotspot clients may reach on the Pi itself. Everything else on the Pi
# (SSH, the decoder's ZeroMQ feed) is closed to the open Wi-Fi.
race_hotspot_input_tcp_ports: [53, 80]
race_hotspot_input_udp_ports: [53, 67]

# ── Portal ──────────────────────────────────────────────────────────────
race_hotspot_portal_title: "RC Race Event"
race_hotspot_portal_port: 80

# ── ufw ────────────────────────────────────────────────────────────────
# ufw's default deny (incoming and routed) would block DHCP/DNS/portal and
# forwarding. When ufw is in use, the role adds the matching allow rules.
race_hotspot_manage_ufw: "{{ openstint_decoder_manage_ufw | default(false) }}"
