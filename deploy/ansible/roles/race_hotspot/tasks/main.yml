---
# tasks/main.yml — race_hotspot role
# (race_dns runs first via meta) Validate -> Wi-Fi country -> NetworkManager AP
# profile -> forwarding -> nftables portal/NAT -> portal service -> ufw -> check.

- name: Validate settings
  ansible.builtin.assert:
    that:
      - race_hotspot_uplinks | length > 0
      - race_hotspot_interface not in race_hotspot_uplinks
      - race_hotspot_passphrase | length == 0 or (race_hotspot_passphrase | length) is within_range(8, 63)
      - race_hotspot_country | length == 2
      - race_hotspot_web_eth0_interface != race_hotspot_interface
    fail_msg: >-
      Need at least one uplink that isn't the hotspot interface, a passphrase
      that is empty (open) or 8-63 characters, a 2-letter Wi-Fi country, and a
      wired interface for race_hotspot_web_on_eth0 that isn't the hotspot.

- name: Refuse to run if we're managing the Pi over the hotspot interface
  ansible.builtin.assert:
    that:
      - ansible_facts['default_ipv4']['interface'] | default('') != race_hotspot_interface
    fail_msg: >-
      This Pi's default route is on {{ race_hotspot_interface }}. Turning it into
      the access point would drop this SSH session and the uplink. Connect the
      Pi by Ethernet first, then rerun.

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Check NetworkManager manages the network
  ansible.builtin.command: nmcli -t -f RUNNING general
  register: race_hotspot_nm
  changed_when: false
  failed_when: race_hotspot_nm.rc != 0 or race_hotspot_nm.stdout != 'running'

# ── Radio ───────────────────────────────────────────────────────────────

- name: Read the Wi-Fi country
  ansible.builtin.command: raspi-config nonint get_wifi_country
  register: race_hotspot_country_now
  changed_when: false
  failed_when: false

- name: Set the Wi-Fi country (unblocks the radio)
  ansible.builtin.command: raspi-config nonint do_wifi_country {{ race_hotspot_country }}
  when: race_hotspot_country_now.stdout | trim != race_hotspot_country
  changed_when: true

- name: Create the hotspot connection profile
  community.general.nmcli:
    conn_name: race-hotspot
    type: wifi
    ifname: "{{ race_hotspot_interface }}"
    ssid: "{{ race_hotspot_ssid }}"
    wifi:
      mode: ap
      band: "{{ race_hotspot_band }}"
      channel: "{{ race_hotspot_channel }}"
      powersave: 2
    wifi_sec: "{{ {'key-mgmt': 'wpa-psk', 'proto': ['rsn'], 'psk': race_hotspot_passphrase} if race_hotspot_passphrase else omit }}"
    # manual, not "shared": race_dns runs DHCP/DNS, not NetworkManager's dnsmasq
    method4: manual
    ip4: "{{ race_hotspot_address }}/{{ race_hotspot_prefix }}"
    method6: disabled
    autoconnect: true
    # Beat any client profile Raspberry Pi Imager left on the same radio.
    autoconnect_priority: 100
    state: present
  no_log: "{{ race_hotspot_passphrase | length > 0 }}"
  notify: Bring up the hotspot

# ── Routing + firewall ──────────────────────────────────────────────────

- name: Enable IPv4 forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-race-hotspot.conf
    content: |
      # Managed by Ansible (role race_hotspot): hotspot clients -> uplink NAT.
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Create /etc/race
  ansible.builtin.file:
    path: /etc/race
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the portal/NAT ruleset
  ansible.builtin.template:
    src: race-portal.nft.j2
    dest: /etc/race/race-portal.nft
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Restart race-portal-firewall

- name: Install the portal and firewall units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - race-portal-firewall.service
    - race-portal.service
  notify:
    - Reload systemd
    - Restart race-portal-firewall
    - Restart race-portal

- name: Install race-portal
  ansible.builtin.copy:
    src: race-portal
    dest: /usr/local/sbin/race-portal
    owner: root
    group: root
    mode: "0755"
  notify: Restart race-portal

- name: Apply unit and ruleset changes before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start the firewall and portal
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - race-portal-firewall.service
    - race-portal.service

# ── Wired side: mDNS name for the event page (race_hotspot_web_on_eth0) ─────────

- name: Install avahi (http://<hostname>.local/ on the wired side)
  ansible.builtin.apt:
    name: avahi-daemon
    state: present
  when: race_hotspot_web_on_eth0 | bool

- name: Publish the event page over mDNS
  ansible.builtin.template:
    src: race-web.avahi.service.j2
    dest: /etc/avahi/services/race-web.service
    owner: root
    group: root
    mode: "0644"
  when: race_hotspot_web_on_eth0 | bool

- name: Stop publishing the event page over mDNS
  ansible.builtin.file:
    path: /etc/avahi/services/race-web.service
    state: absent
  when: not race_hotspot_web_on_eth0 | bool

- name: Enable avahi
  ansible.builtin.systemd_service:
    name: avahi-daemon.service
    enabled: true
    state: started
  when: race_hotspot_web_on_eth0 | bool

# ── ufw (only when the decoder role turned it on) ───────────────────────

- name: Allow DNS/portal (TCP) on the hotspot through ufw
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ race_hotspot_interface }}"
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ (race_hotspot_input_tcp_ports + [race_hotspot_portal_port]) | unique }}"
  when: race_hotspot_manage_ufw | bool

- name: Allow DHCP/DNS (UDP) on the hotspot through ufw
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ race_hotspot_interface }}"
    port: "{{ item | string }}"
    proto: udp
  loop: "{{ race_hotspot_input_udp_ports }}"
  when: race_hotspot_manage_ufw | bool

- name: Let hotspot traffic be routed to the uplinks through ufw
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ race_hotspot_interface }}"
    interface_out: "{{ item }}"
  loop: "{{ race_hotspot_uplinks }}"
  when: race_hotspot_manage_ufw | bool

- name: Allow the event page on the wired side through ufw
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ race_hotspot_web_eth0_interface }}"
    from_ip: "{{ race_hotspot_web_eth0_allowed_cidr }}"
    port: "{{ race_hotspot_portal_port | string }}"
    proto: tcp
    delete: "{{ not race_hotspot_web_on_eth0 | bool }}"
  when: race_hotspot_manage_ufw | bool

- name: Allow mDNS on the wired side through ufw
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ race_hotspot_web_eth0_interface }}"
    port: "5353"
    proto: udp
    delete: "{{ not race_hotspot_web_on_eth0 | bool }}"
  when: race_hotspot_manage_ufw | bool

# ── Check ───────────────────────────────────────────────────────────────

- name: Read hotspot state
  ansible.builtin.command: nmcli -t -f GENERAL.STATE connection show race-hotspot
  register: race_hotspot_state
  changed_when: false
  failed_when: false

- name: Summary
  ansible.builtin.debug:
    msg:
      - "SSID:    {{ race_hotspot_ssid }} ({{ 'WPA2' if race_hotspot_passphrase else 'open' }}), {{ race_hotspot_state.stdout | default('state unknown') }}"
      - "Portal:  http://{{ race_hotspot_hostname }}/  ({{ race_hotspot_address }})"
      - >-
        Wired:   {{ ('http://' ~ ansible_facts['hostname'] ~ '.local/ on ' ~ race_hotspot_web_eth0_interface)
        if race_hotspot_web_on_eth0 | bool else 'off (race_hotspot_web_on_eth0: false)' }}
      - "Uplinks: {{ race_hotspot_uplinks | join(', ') }}  (let through for {{ race_hotspot_access_timeout }})"
      - "Allowed: sudo nft list set inet race_portal allowed"
      - "Logs:    journalctl -u race-portal -f"
