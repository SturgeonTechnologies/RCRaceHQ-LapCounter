---
# defaults/main.yml — ssm_hybrid_node role
#
# Registers a non-EC2 Linux device (race-decoder Pi) with AWS Systems Manager
# as a hybrid managed node, keyed by its Ethernet MAC address, and installs the
# CloudWatch agent for a heartbeat + basic health metrics. See README.md.

# ── AWS ─────────────────────────────────────────────────────────────────
ssm_hybrid_node_region: "us-west-2"
# Service role the device assumes (trust: ssm.amazonaws.com). Created once by
# hand; docs/register_race_decoder.md has the exact JSON.
ssm_hybrid_node_iam_role: "RaceDecoderSSMNode"

# ── Identity ────────────────────────────────────────────────────────────
# Interface whose MAC is the device ID. "" = first wired NIC found
# (eth*/end*/enx*/enp*). Wi-Fi is never auto-picked: it can be swapped/randomised.
ssm_hybrid_node_interface: ""
# Device registry keyed by MAC (any common format). Put it in inventory
# group_vars so every Pi you own is listed in one place:
#   ssm_hybrid_node_devices:
#     "dc:a6:32:01:02:03": { name: rcclub-track1, tags: { Club: rcclub } }
ssm_hybrid_node_devices: {}
# true = refuse to register a MAC that isn't in the registry above.
ssm_hybrid_node_require_known_mac: false
# Name used when the MAC isn't in the registry: <prefix>-<mac without colons>.
ssm_hybrid_node_name_prefix: "racedecoder"
# Tags put on every managed node (plus MacAddress and Name, which always win).
ssm_hybrid_node_tags:
  Role: race-decoder
# Re-imaged board (same MAC, no local registration) => deregister its old
# mi- record before registering again. false = fail instead.
ssm_hybrid_node_replace_stale: true

# ── SSM agent ───────────────────────────────────────────────────────────
# ssm-setup-cli verifies the agent's signature itself and must be downloaded
# fresh from the activation's Region each time (AWS guidance).
ssm_hybrid_node_setup_cli_url: >-
  https://amazon-ssm-{{ ssm_hybrid_node_region }}.s3.{{ ssm_hybrid_node_region }}.amazonaws.com/latest/debian_{{ ssm_hybrid_node_deb_arch }}/ssm-setup-cli
# Rotate the device's on-prem private key every N days (0 = never).
ssm_hybrid_node_key_rotate_days: 30

# ── CloudWatch agent ────────────────────────────────────────────────────
ssm_hybrid_node_cloudwatch_enabled: true
# true = reinstall the latest agent on every run (signature still verified).
ssm_hybrid_node_cloudwatch_upgrade: false
ssm_hybrid_node_metrics_namespace: "RaceDecoder"
ssm_hybrid_node_metrics_interval: 60
# Process whose count is reported as procstat_lookup_pid_count (0 / missing =
# decoder down). Regex on the executable name.
ssm_hybrid_node_procstat_exe: "openstint_"
