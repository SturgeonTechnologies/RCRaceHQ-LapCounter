galaxy_info:
  role_name: ssm_hybrid_node
  author: rileyschuit
  description: >-
    Registers a non-EC2 Linux device with AWS Systems Manager as a hybrid
    managed node keyed by its Ethernet MAC address (one-use activation,
    re-image safe) and installs a signature-checked CloudWatch agent.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - trixie
dependencies: []
