---
# cloudwatch.yml — signature-checked CloudWatch agent, on-prem mode, using the
# credentials the SSM agent shares in /root/.aws/credentials.

- name: Install what cwagent-fetch needs
  ansible.builtin.apt:
    name: [curl, gnupg, gpgv]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install cwagent-fetch
  ansible.builtin.copy:
    src: cwagent-fetch
    dest: /usr/local/sbin/cwagent-fetch
    owner: root
    group: root
    mode: "0755"

- name: Is the CloudWatch agent installed?
  ansible.builtin.command: dpkg-query -W -f=${Status} amazon-cloudwatch-agent
  register: ssm_hybrid_node_cwagent_pkg
  changed_when: false
  failed_when: false

- name: Download, verify and install the agent
  when: >-
    (ssm_hybrid_node_cloudwatch_upgrade | bool)
    or ('install ok installed' not in ssm_hybrid_node_cwagent_pkg.stdout)
  block:
    - name: Download and verify the signed .deb
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/cwagent-fetch
          - "{{ ssm_hybrid_node_region }}"
          - "{{ ssm_hybrid_node_deb_arch }}"
          - /var/cache/amazon-cloudwatch-agent.deb
      changed_when: true

    - name: Install the verified .deb
      ansible.builtin.apt:
        deb: /var/cache/amazon-cloudwatch-agent.deb
      notify: Reload CloudWatch agent config

  always:
    - name: Remove the downloaded .deb
      ansible.builtin.file:
        path: /var/cache/amazon-cloudwatch-agent.deb
        state: absent

- name: Point the agent at the SSM agent's shared credentials
  ansible.builtin.template:
    src: common-config.toml.j2
    dest: /opt/aws/amazon-cloudwatch-agent/etc/common-config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Reload CloudWatch agent config

- name: Render the metrics config
  ansible.builtin.template:
    src: cloudwatch-agent.json.j2
    dest: /opt/aws/amazon-cloudwatch-agent/etc/racedecoder.json
    owner: root
    group: root
    mode: "0644"
  notify: Reload CloudWatch agent config

- name: Wait for the SSM agent to share its credentials
  ansible.builtin.wait_for:
    path: /root/.aws/credentials
    timeout: 120
  register: ssm_hybrid_node_creds
  failed_when: false
  when: not ansible_check_mode

- name: Warn when no shared credentials showed up
  ansible.builtin.debug:
    msg: >-
      /root/.aws/credentials didn't appear within 2 minutes, so the CloudWatch
      agent can't publish yet. Check `journalctl -u amazon-ssm-agent` and that
      the node shows Online in Fleet Manager.
  when: ssm_hybrid_node_creds.failed | default(false) or ssm_hybrid_node_creds.state | default('file') != 'file'

- name: Apply agent config now
  ansible.builtin.meta: flush_handlers

- name: Keep the CloudWatch agent running
  ansible.builtin.systemd_service:
    name: amazon-cloudwatch-agent
    enabled: true
    state: started
  when: not ansible_check_mode
