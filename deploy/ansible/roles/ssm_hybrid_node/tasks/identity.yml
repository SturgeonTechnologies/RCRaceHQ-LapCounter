---
# identity.yml — pick the wired NIC, read its MAC, look it up in the registry.

- name: Pick the wired interface
  ansible.builtin.set_fact:
    ssm_hybrid_node_deb_arch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_facts['architecture']] }}"
    ssm_hybrid_node_iface: >-
      {{ ssm_hybrid_node_interface
         or (ansible_facts['interfaces'] | select('match', '^(eth|end|enx|enp)') | sort | first | default('')) }}

- name: Fail when there is no wired interface
  ansible.builtin.fail:
    msg: >-
      No wired NIC found (looked for eth*/end*/enx*/enp* in
      {{ ansible_facts['interfaces'] | join(', ') }}). Set ssm_hybrid_node_interface.
  when: ssm_hybrid_node_iface | length == 0

- name: Read its MAC address
  ansible.builtin.set_fact:
    ssm_hybrid_node_mac: >-
      {{ ansible_facts[ssm_hybrid_node_iface | replace('-', '_')]['macaddress'] | default('') | lower }}

- name: Fail when the interface has no MAC
  ansible.builtin.assert:
    that: ssm_hybrid_node_mac is match('^([0-9a-f]{2}:){5}[0-9a-f]{2}$')
    fail_msg: "{{ ssm_hybrid_node_iface }} has no usable MAC address ({{ ssm_hybrid_node_mac }})."

- name: Look the MAC up in the device registry
  ansible.builtin.set_fact:
    ssm_hybrid_node_device: "{{ item.value }}"
  loop: "{{ ssm_hybrid_node_devices | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: (item.key | lower | regex_replace('[^0-9a-f]', '')) == (ssm_hybrid_node_mac | replace(':', ''))

- name: Refuse unknown devices when the registry is enforced
  ansible.builtin.fail:
    msg: >-
      {{ ssm_hybrid_node_mac }} ({{ ssm_hybrid_node_iface }}) isn't in
      ssm_hybrid_node_devices. Add it there to register this device.
  when:
    - ssm_hybrid_node_require_known_mac | bool
    - ssm_hybrid_node_device is not defined

- name: Settle the device name and tags
  ansible.builtin.set_fact:
    ssm_hybrid_node_name: >-
      {{ (ssm_hybrid_node_device | default({})).name
         | default(ssm_hybrid_node_name_prefix ~ '-' ~ (ssm_hybrid_node_mac | replace(':', '')), true) }}
    ssm_hybrid_node_all_tags: >-
      {{ ssm_hybrid_node_tags | combine((ssm_hybrid_node_device | default({})).tags | default({})) }}
