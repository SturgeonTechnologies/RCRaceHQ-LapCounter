---
# tasks/main.yml — ssm_hybrid_node role
# identity (MAC -> name/tags) -> SSM registration -> CloudWatch agent.
# Idempotent: a registered device with the right tags changes nothing.

- name: Assert a 64-bit Debian-family target
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['architecture'] in ['aarch64', 'x86_64']
    fail_msg: >-
      ssm_hybrid_node supports 64-bit Debian/Raspberry Pi OS only; this host is
      {{ ansible_facts['distribution'] }} / {{ ansible_facts['architecture'] }}.

- name: Work out the device identity from its MAC address
  ansible.builtin.include_tasks: identity.yml

- name: Register with Systems Manager
  ansible.builtin.include_tasks: register.yml

- name: Install and configure the CloudWatch agent
  ansible.builtin.include_tasks: cloudwatch.yml
  when: ssm_hybrid_node_cloudwatch_enabled | bool
